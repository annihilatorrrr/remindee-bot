Hello: |
  Привет! Я remindee bot. Мое предназначение — напоминать вам о том, о чем попросите, тогда, когда попросите.

  Например:
  17:30 пойти в ресторан => напомню сегодня в 17:30
  01.01 00:00 С новым годом! => напомню 1-го января в 12 часов ночи
  55 10 * * 1-5 созвон => буду напоминать каждый будний в 10:55 (формат CRON выражений)

  Для начала пришлите мне свое местоположение 📍 или выберите часовой пояс из списка самостоятельно через команду /settimezone.
